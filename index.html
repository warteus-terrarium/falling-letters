<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: black;
    overflow: hidden;
    font-family: 'Amethysta', serif;
  }

  #wrapper {
    position: absolute;
    width: 100%; height: 100%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }

  .click-instruction {
    font-size: 1.4rem;
    color: #888;
    text-align: center;
    transition: opacity 0.5s;
  }

  .letter {
    position: absolute;
    font-size: 2.4rem;
    top: -100px;
    opacity: 0;
    color: #808080;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.6s ease;
    font-weight: bold;
    pointer-events: auto;
  }

  .is-final {
    color: #FFD700;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
  }

  @keyframes oscillate {
    0% { transform: translateX(0); }
    50% { transform: translateX(6px); }
    100% { transform: translateX(0); }
  }

  .oscillate {
    animation: oscillate 0.5s ease-out;
  }
</style>
</head>
<body>

<div id="wrapper">
  <div class="click-instruction">Cliquez pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

// 🎼 Gamme de Do majeur (fréquences)
const scale = [
  261.63, // C
  293.66, // D
  329.63, // E
  349.23, // F
  392.00, // G
  440.00, // A
  493.88  // B
];

let audioCtx;
let started = false;

// 🔓 Init audio
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// 🎧 Son "harpe-like"
function playNote(freq, pan = 0) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const panner = audioCtx.createStereoPanner();

  osc.type = "triangle"; // son doux type harpe
  osc.frequency.value = freq;

  // enveloppe douce
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

  // stéréo
  panner.pan.value = pan;

  osc.connect(gain);
  gain.connect(panner);
  panner.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 1.3);
}

// 🎯 mapping position → stéréo
function getPan(x) {
  const width = window.innerWidth;
  return (x / width) * 2 - 1; // -1 (gauche) → +1 (droite)
}

// 🎼 note selon index
function getNote(i) {
  return scale[i % scale.length];
}

function startAnimation() {
  if (started) return;
  started = true;

  initAudio();

  document.querySelector(".click-instruction").style.opacity = "0";

  let delay = 0;
  let offsetX = 60;
  let noteIndex = 0;

  words.forEach(word => {
    word.split("").forEach(char => {
      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = offsetX + "px";
      document.body.appendChild(span);

      const myNote = getNote(noteIndex++);
      const myPan = getPan(offsetX);

      // interaction hover ✨
      span.addEventListener("mouseenter", () => {
        playNote(myNote, myPan);
      });

      setTimeout(() => {
        span.style.opacity = "1";
        span.style.top = (200 + Math.random() * 40) + "px";

        setTimeout(() => {
          span.classList.add("is-final");
          span.classList.add("oscillate");

          playNote(myNote, myPan);

        }, 1500);

      }, delay);

      delay += 250;
      offsetX += 40;
    });

    offsetX += 60;
  });
}

const wrapper = document.getElementById("wrapper");
wrapper.addEventListener("click", startAnimation);
wrapper.addEventListener("touchstart", startAnimation);
</script>

</body>
</html>
