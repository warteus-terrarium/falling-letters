<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Amethysta', serif;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

#wrapper {
  position: absolute;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
}

.click-instruction {
  color: #888;
  font-size: 1.4rem;
  transition: opacity 0.5s;
}

.letter {
  position: absolute;
  font-size: 2.4rem;
  top: -100px;
  opacity: 0;
  color: #808080;
  transition: top 1.5s ease-out, opacity 1s ease-out, color 0.4s ease;
  font-weight: bold;
  pointer-events: auto;
  z-index: 3;
}

.gold {
  color: #FFD700;
  text-shadow: 0 0 15px rgba(255,215,0,0.9);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="wrapper">
  <div class="click-instruction">Clique pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

let audioCtx;
let started = false;
let allLetters = [];
let constellationDone = false;

// 🎧 AUDIO
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// 🎼 GAMME LA MINEUR
const scale = [0, 2, 3, 5, 7, 8, 10];

// 🎼 PROGRESSION
const progression = [
  [0,2,4], // Am
  [5,0,2], // F
  [3,5,0], // C
  [4,6,1]  // G
];

let chordStep = 0;

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function getQuantizedNote(y, chord) {
  const minY = 180;
  const maxY = 260;

  let t = (y - minY) / (maxY - minY);
  t = Math.max(0, Math.min(1, t));

  const octave = Math.floor(3 + (1 - t) * 2);
  const degree = chord[Math.floor(Math.random() * chord.length)];

  const midi = 57 + scale[degree] + (octave - 4) * 12;
  return midiToFreq(midi);
}

function getCurrentChord() {
  return progression[chordStep % progression.length];
}

// 🎧 ACCORD
function playChord(freq, pan) {
  const ratios = [1, 1.2, 1.5];

  ratios.forEach((r, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = "triangle";
    osc.frequency.value = freq * r;

    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

    panner.pan.value = pan;

    osc.connect(gain);
    gain.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(audioCtx.currentTime + i * 0.04);
    osc.stop(audioCtx.currentTime + 2);
  });
}

function getPan(x) {
  return (x / window.innerWidth) * 2 - 1;
}

// 🌟 PARTICULES
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function spawnParticles(x, y) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 1
    });
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;

    ctx.fillStyle = "rgba(255,215,0," + p.life + ")";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  particles = particles.filter(p => p.life > 0);
  requestAnimationFrame(animateParticles);
}
animateParticles();

// 🌌 CONSTELLATION
function drawConstellation() {
  ctx.strokeStyle = "rgba(255,215,0,0.4)";
  ctx.lineWidth = 1;

  for (let i = 0; i < allLetters.length - 1; i++) {
    const a = allLetters[i].getBoundingClientRect();
    const b = allLetters[i + 1].getBoundingClientRect();

    ctx.beginPath();
    ctx.moveTo(a.left + a.width/2, a.top + a.height/2);
    ctx.lineTo(b.left + b.width/2, b.top + b.height/2);
    ctx.stroke();
  }
}

// 🎵 RYTHME
const rhythm = [180, 120, 260, 140, 320, 200];

function startAnimation() {
  if (started) return;
  started = true;

  initAudio();
  document.querySelector(".click-instruction").style.opacity = "0";

  let delay = 0;
  let offsetX = 60;
  let noteIndex = 0;

  words.forEach(word => {
    word.split("").forEach(char => {

      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = offsetX + "px";

      document.body.appendChild(span);
      allLetters.push(span);

      const pan = getPan(offsetX);

      span.addEventListener("mouseenter", () => {
        if (!span.classList.contains("gold")) {
          const rect = span.getBoundingClientRect();
          const freq = getQuantizedNote(rect.top, getCurrentChord());

          span.classList.add("gold");
          playChord(freq, pan);

          spawnParticles(
            rect.left + rect.width/2,
            rect.top + rect.height/2
          );

          setTimeout(() => span.classList.remove("gold"), 400);
        }
      });

      setTimeout(() => {
        span.style.opacity = "1";

        const finalY = 200 + Math.random() * 40;
        span.style.top = finalY + "px";

        setTimeout(() => {
          const rect = span.getBoundingClientRect();
          const freq = getQuantizedNote(rect.top, getCurrentChord());

          span.classList.add("gold");
          playChord(freq, pan);

          spawnParticles(
            rect.left + rect.width/2,
            rect.top + rect.height/2
          );

          if (!constellationDone && allLetters.every(l => l.classList.contains("gold"))) {
            constellationDone = true;
            drawConstellation();
          }

        }, 1500);

      }, delay);

      delay += rhythm[noteIndex % rhythm.length];
      offsetX += 40;

      noteIndex++;

      // 🎼 progression harmonique
      if (noteIndex % 4 === 0) {
        chordStep++;
      }
    });

    offsetX += 60;
  });

  setTimeout(() => {
    allLetters.forEach(l => l.classList.remove("gold"));
  }, delay + 2000);
}

document.getElementById("wrapper")
  .addEventListener("click", startAnimation);
</script>

</body>
</html>
