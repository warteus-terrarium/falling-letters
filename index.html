<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Amethysta', serif;
  }
  #wrapper {
    position: absolute;
    width: 100%; height: 100%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .btn-start {
    padding: 15px 30px;
    font-size: 1.2rem;
    background: rgba(255, 215, 0, 0.1);
    border: 2px solid #FFD700;
    color: #555;
    border-radius: 50px;
    transition: all 0.3s;
  }
  .btn-start:hover { background: #FFD700; color: white; }

  .letter {
    position: absolute;
    font-size: 2.5rem;
    top: -100px;
    opacity: 0;
    color: #808080;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.6s ease;
    pointer-events: none;
    font-weight: bold;
  }
  .is-final { color: #FFD700 !important; }
  @keyframes oscillate {
    0% { transform: translateX(0); }
    50% { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }
  .oscillate { animation: oscillate 0.5s ease-out; }
</style>
</head>
