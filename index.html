<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lettre Harpe Séquentielle</title>
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: 'Amethysta';
    cursor: pointer;
  }
  .letter {
    position: absolute;
    font-size: 2rem;
    top: -50px;
    opacity: 0;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.5s;
    color: #808080;
  }
  @keyframes oscillate {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }
  .oscillate { animation: oscillate 0.5s ease-out; }
  .click-instruction {
    position: absolute;
    top: 50%;
    width: 100%;
    text-align: center;
    font-size: 1.5rem;
    /* J'ai temporairement mis la couleur en noir au cas où votre fond soit blanc, 
       remettez #fff si votre Google Site a un fond sombre ! */
    color: #000; 
  }
</style>
</head>
<body>

<div class="click-instruction">Cliquez pour commencer</div>

<script>
const words = ["Orpheus", "CARENTHIR"];
const minY = 200;
const maxY = 220;

let audioBuffers = [];
let context;

// Jouer une note
function playHarpNote() {
  if (audioBuffers.length === 0) return;
  const buffer = audioBuffers[Math.floor(Math.random() * audioBuffers.length)];
  const source = context.createBufferSource();
  source.buffer = buffer;
  source.connect(context.destination);
  source.start(0);
}

// Charger les sons
async function loadSounds() {
  // J'ai remplacé vos URL par des URL de piano fiables pour le test.
  // Remplacez ces liens par les URL directes vers vos fichiers hébergés sur GitHub.
  const notesSrc = [
    'https://tonejs.github.io/audio/salamander/C4.mp3',
    'https://tonejs.github.io/audio/salamander/D4.mp3',
    'https://tonejs.github.io/audio/salamander/E4.mp3',
    'https://tonejs.github.io/audio/salamander/F4.mp3',
    'https://tonejs.github.io/audio/salamander/G4.mp3',
    'https://tonejs.github.io/audio/salamander/A4.mp3',
    'https://tonejs.github.io/audio/salamander/B4.mp3'
  ];
  
  audioBuffers = [];
  
  for (const src of notesSrc) {
    try {
      const response = await fetch(src);
      // On vérifie que le fichier a bien été trouvé (Statut 200 OK)
      if (!response.ok) {
        throw new Error(`Erreur HTTP: ${response.status}`);
      }
      const arrayBuffer = await response.arrayBuffer();
      const buffer = await context.decodeAudioData(arrayBuffer);
      audioBuffers.push(buffer);
    } catch (error) {
      console.warn(`Erreur lors du chargement de ${src}:`, error);
    }
  }
}

// Chute des lettres
function startLetters() {
  document.querySelector(".click-instruction").style.display = "none";
  let offsetX = 50;
  let delay = 0;
  const delayStep = 300;

  words.forEach(word => {
    word.split("").forEach(letter => {
      const span = document.createElement("span");
      span.classList.add("letter");
      span.textContent = letter;
      document.body.appendChild(span);

      span.style.left = offsetX + "px";
      offsetX += 30;

      setTimeout(() => {
        const finalY = minY + Math.random() * (maxY - minY);
        span.style.top = finalY + "px";
        span.style.opacity = 1;

        span.addEventListener("transitionend", function handler(e) {
          if (e.propertyName === "top") {
            span.style.color = "#FFD700";
            playHarpNote();
            span.classList.add("oscillate");
            span.removeEventListener("transitionend", handler);
          }
        });
      }, delay);

      delay += delayStep;
    });
    offsetX += 30;
  });
}

// Clic pour démarrer
document.body.addEventListener("click", async () => {
  const instruction = document.querySelector(".click-instruction");
  instruction.textContent = "Chargement des sons…";
  
  context = new (window.AudioContext || window.webkitAudioContext)();
  
  await loadSounds(); // charger avant de démarrer la chute
  
  // Sécurité : même si aucun son n'a chargé, on lance l'animation
  if (audioBuffers.length === 0) {
    instruction.textContent = "Sons indisponibles. Démarrage...";
    setTimeout(startLetters, 1000);
  } else {
    startLetters();
  }
}, { once: true });

</script>

</body>
</html>
