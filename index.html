<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Amethysta', serif;
  }
  #wrapper {
    position: absolute;
    width: 100%; height: 100%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .click-instruction {
    font-size: 1.4rem;
    color: #888;
    text-align: center;
    transition: opacity 0.5s;
  }
  .letter {
    position: absolute;
    font-size: 2.2rem;
    top: -100px;
    opacity: 0;
    color: #808080;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.6s ease;
    pointer-events: none;
    font-weight: bold;
  }
  .is-final {
    color: #FFD700 !important;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  @keyframes oscillate {
    0% { transform: translateX(0); }
    50% { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }
  .oscillate { animation: oscillate 0.5s ease-out; }
</style>
</head>
<body>

<div id="wrapper">
  <div class="click-instruction">Cliquez ici pour l'éveil d'Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];
const sounds = [
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-C4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-E4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-G4.mp3'
];

// Pool audio
const audioPool = sounds.map(src => {
  const a = new Audio(src);
  a.preload = "auto";
  return a;
});

let started = false;
let audioUnlocked = false;

// 🔓 Débloque l’audio UNE fois
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  const dummy = new Audio(sounds[0]);
  dummy.volume = 0;
  dummy.play().then(() => {
    dummy.pause();
  }).catch(() => {});
}

// 🔊 Lecture fiable
function playHarp() {
  const sound = audioPool[Math.floor(Math.random() * audioPool.length)];
  const clone = sound.cloneNode();
  clone.volume = 0.6;

  clone.play().catch(() => {
    console.log("Lecture bloquée");
  });
}

function startAnimation() {
  if (started) return;
  started = true;

  unlockAudio(); // ✅ clé de la solution

  document.querySelector(".click-instruction").style.opacity = "0";
  
  let delay = 0;
  let offsetX = 40;

  words.forEach((word) => {
    word.split("").forEach((char) => {
      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = offsetX + "px";
      document.body.appendChild(span);

      setTimeout(() => {
        span.style.opacity = "1";
        span.style.top = (200 + Math.random() * 30) + "px";

        setTimeout(() => {
          span.classList.add("is-final");
          span.classList.add("oscillate");
          playHarp(); // ✅ fonctionne maintenant
        }, 1500);

      }, delay);

      delay += 300;
      offsetX += 35;
    });

    offsetX += 50;
  });
}

const wrapper = document.getElementById("wrapper");

// 👉 Important : click plutôt que mousedown (plus fiable mobile + desktop)
wrapper.addEventListener("click", startAnimation);
wrapper.addEventListener("touchstart", startAnimation);
</script>

</body>
</html>
