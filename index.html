<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css?family=Amethysta" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: "Amethysta", serif;
}

/* texture légère */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0 1px, transparent 1px 100%),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 4px
    );
  opacity: 0.7;
}

#wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
}

.click-instruction {
  color: #888;
  font-size: 1.4rem;
  text-align: center;
}

/* =========================
   LETTRES
========================= */
.letter {
  position: absolute;
  top: -100px;
  opacity: 0;
  white-space: pre;
  pointer-events: auto;

  transition:
    top 1.6s ease-out,
    opacity 1.2s ease-out,
    color 0.3s ease,
    text-shadow 0.3s ease;

  color: #7a7a7a;
}

/* ligne 1 (titre) */
.line1 {
  font-size: 3.8rem;
  font-weight: bold;
}

/* ligne 2 (sous-titre) */
.line2 {
  font-size: 2.2rem;
  opacity: 0.85;
}

/* doré */
.gold {
  color: #FFD700 !important;
  text-shadow:
    0 0 10px rgba(255,215,0,0.9),
    0 0 20px rgba(255,215,0,0.5);
}

</style>
</head>

<body>

<div id="wrapper">
  <div class="click-instruction">
    Cliquez ici pour réveiller Orphée.
  </div>
</div>

<script>
/* =========================
   TEXTE
========================= */
const lines = [
  { text: "Orpheus Caranthir", class: "line1" },
  { text: "          Barde mélancolique, Roi du rêve.", class: "line2" }
];

/* =========================
   AUDIO SIMPLE
========================= */
let actx = null;

function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNote(freq) {
  const osc = actx.createOscillator();
  const gain = actx.createGain();

  osc.type = "triangle";
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(0.0001, actx.currentTime);
  gain.gain.linearRampToValueAtTime(0.2, actx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 1.5);

  osc.connect(gain);
  gain.connect(actx.destination);

  osc.start();
  osc.stop(actx.currentTime + 1.5);
}

/* =========================
   ANIMATION
========================= */
let started = false;

function startAnimation() {
  if (started) return;
  started = true;

  initAudio();
  document.querySelector(".click-instruction").style.display = "none";

  let offsetX = 60;
  let delay = 0;

  lines.forEach((lineObj, lineIndex) => {

    // ralentir la 2e ligne
    let lineDelayMultiplier = lineIndex === 1 ? 1.6 : 1;

    lineObj.text.split("").forEach(char => {

      const span = document.createElement("span");
      span.className = "letter " + lineObj.class;
      span.textContent = char;
      span.style.left = offsetX + "px";

      document.body.appendChild(span);

      setTimeout(() => {

        span.style.opacity = "1";
        span.style.top = (220 + lineIndex * 70 + Math.random()*10) + "px";

        setTimeout(() => {
          span.classList.add("gold");

          const freq = 220 + Math.random()*200;
          playNote(freq);

        }, 1500);

      }, delay * lineDelayMultiplier);

      delay += 120 * lineDelayMultiplier;
      offsetX += lineIndex === 0 ? 36 : 28;

    });

    offsetX += 80;
    delay += 400; // pause entre lignes
  });
}

document.getElementById("wrapper").addEventListener("click", startAnimation);
</script>

</body>
</html>
