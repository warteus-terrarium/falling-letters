<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lettre Harpe Séquentielle avec Oscillation</title>
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: 'Amethysta';
    cursor: pointer;
  }
  .letter {
    position: absolute;
    font-size: 2rem;
    top: -50px; /* départ hors écran */
    opacity: 0;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.5s;
    color: #808080; /* couleur de départ gris */
  }

  /* Animation d'oscillation après l'arrêt */
  @keyframes oscillate {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }

  .oscillate {
    animation: oscillate 0.5s ease-out;
  }

  .click-instruction {
    position: absolute;
    top: 50%;
    width: 100%;
    text-align: center;
    font-size: 1.5rem;
    color: #fff;
  }
</style>
</head>
<body>

<div class="click-instruction">Cliquez pour commencer</div>

<script>
const words = ["Orpheus", "CARENTHIR"];
const minY = 200;
const maxY = 220;

// Précharger les sons de harpe
const notesSrc = [
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-C4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-D4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-E4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-F4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-G4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-A4.mp3',
  'https://cdn.jsdelivr.net/gh/mdn/webaudio-examples/audio/harp-B4.mp3'
];
const audioBuffers = [];
const context = new (window.AudioContext || window.webkitAudioContext)();

// Charger tous les sons
async function loadSounds() {
  for (const src of notesSrc) {
    const response = await fetch(src);
    const arrayBuffer = await response.arrayBuffer();
    const buffer = await context.decodeAudioData(arrayBuffer);
    audioBuffers.push(buffer);
  }
}
loadSounds();

// Jouer une note de harpe aléatoire
function playHarpNote() {
  if (audioBuffers.length === 0) return;
  const buffer = audioBuffers[Math.floor(Math.random() * audioBuffers.length)];
  const source = context.createBufferSource();
  source.buffer = buffer;
  source.connect(context.destination);
  source.start(0);
}

// Fonction pour lancer la chute des lettres
function startLetters() {
  document.querySelector(".click-instruction").style.display = "none";

  let offsetX = 50;
  let delay = 0;
  const delayStep = 300; // temps entre chaque lettre en ms

  words.forEach(word => {
    word.split("").forEach(letter => {
      const span = document.createElement("span");
      span.classList.add("letter");
      span.textContent = letter;
      document.body.appendChild(span);

      span.style.left = offsetX + "px";
      offsetX += 30;

      setTimeout(() => {
        const finalY = minY + Math.random() * (maxY - minY);
        span.style.top = finalY + "px";
        span.style.opacity = 1;

        // Détecter fin de transition pour jouer le son, changer la couleur et lancer l'oscillation
        span.addEventListener("transitionend", function handler(e) {
          if (e.propertyName === "top") {
            span.style.color = "#FFD700"; // doré à l'arrêt
            playHarpNote();
            // Ajouter l'oscillation
            span.classList.add("oscillate");
            span.removeEventListener("transitionend", handler);
          }
        });
      }, delay);

      delay += delayStep;
    });
    offsetX += 30; // espace entre mots
  });
}

// Démarrer l'audio et la chute au clic
document.body.addEventListener("click", () => {
  context.resume().then(() => {
    startLetters();
  });
}, { once: true });

</script>

</body>
</html>
