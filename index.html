<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* On s'assure que le fond est cliquable */
    background-color: rgba(0,0,0,0.01); 
    overflow: hidden;
    font-family: 'Amethysta', serif;
  }

  #wrapper {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
    /* Supprimez la ligne ci-dessous une fois que ça marche */
    border: 2px dashed rgba(255,0,0,0.2); 
  }

  .click-instruction {
    font-size: 1.5rem;
    color: #555;
    pointer-events: none;
    text-align: center;
  }

  .letter {
    position: absolute;
    font-size: 2rem;
    top: -50px;
    opacity: 0;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.5s;
    color: #808080;
    pointer-events: none;
  }

  @keyframes oscillate {
    0% { transform: translateX(0); }
    50% { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }
  .oscillate { animation: oscillate 0.5s ease-out; }
</style>
</head>
<body>

<div id="wrapper">
  <div class="click-instruction">Cliquez ici pour charger la harpe</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];
let audioBuffers = [];
let context;
let started = false;

async function init() {
  if (started) return;
  started = true;

  const instruction = document.querySelector(".click-instruction");
  instruction.textContent = "Chargement...";

  // 1. Initialisation Audio
  context = new (window.AudioContext || window.webkitAudioContext)();
  if (context.state === 'suspended') await context.resume();

  // 2. Chargement des sons (URLs de secours fiables)
  const notesSrc = [
    'https://tonejs.github.io/audio/salamander/C4.mp3',
    'https://tonejs.github.io/audio/salamander/E4.mp3',
    'https://tonejs.github.io/audio/salamander/G4.mp3'
  ];

  for (const src of notesSrc) {
    try {
      const resp = await fetch(src);
      const arrayBuffer = await resp.arrayBuffer();
      const buffer = await new Promise((res, rej) => context.decodeAudioData(arrayBuffer, res, rej));
      audioBuffers.push(buffer);
    } catch (e) { console.error(e); }
  }

  // 3. Lancement de l'animation
  instruction.style.display = "none";
  startLetters();
}

function playSound() {
  if (!audioBuffers.length) return;
  const source = context.createBufferSource();
  source.buffer = audioBuffers[Math.floor(Math.random() * audioBuffers.length)];
  source.connect(context.destination);
  source.start(0);
}

function startLetters() {
  let offsetX = 20;
  let delay = 0;

  words.forEach(word => {
    word.split("").forEach(char => {
      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = offsetX + "px";
      document.body.appendChild(span);

      setTimeout(() => {
        span.style.top = (200 + Math.random() * 20) + "px";
        span.style.opacity = 1;
        span.addEventListener("transitionend", (e) => {
          if (e.propertyName === "top") {
            span.style.color = "#FFD700";
            span.classList.add("oscillate");
            playSound();
          }
        }, {once: true});
      }, delay);

      delay += 250;
      offsetX += 25;
    });
    offsetX += 40;
  });
}

// Double sécurité pour le clic
const wrapper = document.getElementById("wrapper");
wrapper.addEventListener("click", init);
wrapper.addEventListener("touchstart", init);

</script>
</body>
</html>
