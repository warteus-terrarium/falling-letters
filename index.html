<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css?family=Amethysta" rel="stylesheet">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: "Amethysta", serif;
}

canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}

.click-instruction {
  color: #888;
  font-size: 1.4rem;
  text-align: center;
  transition: opacity 0.5s ease;
}

#letters-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  transform-origin: center center;
}

.letter {
  position: absolute;
  top: -100px;
  opacity: 0;
  color: #808080;
  font-size: 2.4rem;
  font-weight: bold;
  pointer-events: auto;
  transition:
    top 1.5s ease-out,
    opacity 1s ease-out,
    color 0.35s ease,
    text-shadow 0.35s ease;
}

.gold {
  color: #FFD700;
  text-shadow:
    0 0 10px rgba(255, 215, 0, 0.9),
    0 0 20px rgba(255, 215, 0, 0.5);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="letters-layer"></div>

<div id="wrapper">
  <div class="click-instruction">Clique pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

/* ================= AUDIO ================= */
let actx = null;
let bufs = [];

function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (bufs.length) return;

  for (let i = 0; i < 4; i++) {
    const sr = 44100;
    const dur = 1.2;
    const buf = actx.createBuffer(1, sr * dur, sr);
    const data = buf.getChannelData(0);

    for (let j = 0; j < buf.length; j++) {
      data[j] = (Math.random() * 2 - 1) * 0.6;
    }
    bufs.push(buf);
  }
}

function playGlitchSound() {
  if (!actx) initAudio();
  const src = actx.createBufferSource();
  src.buffer = bufs[Math.floor(Math.random() * bufs.length)];

  const gain = actx.createGain();
  gain.gain.setValueAtTime(1, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 1);

  src.connect(gain);
  gain.connect(actx.destination);

  src.start();
}

/* ================= MUSIC ================= */
const scale = [0,2,3,5,7,8,10];
const progression = [[0,2,4],[5,0,2],[3,5,0],[4,6,1]];
let chordStep = 0;

function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}

function getQuantizedNote(y,chord){
  const t = Math.max(0, Math.min(1, (y-180)/80));
  const octave = Math.floor(3 + (1-t)*2);
  const degree = chord[Math.floor(Math.random()*chord.length)];
  return midiToFreq(57 + scale[degree] + (octave-4)*12);
}

function getCurrentChord(){return progression[chordStep%progression.length];}

function playChord(freq,pan){
  if (!actx) initAudio();

  [1,1.2,1.5].forEach((r,i)=>{
    const o=actx.createOscillator();
    const g=actx.createGain();
    const p=actx.createStereoPanner();

    o.type="triangle";
    o.frequency.value=freq*r;

    g.gain.setValueAtTime(0,actx.currentTime);
    g.gain.linearRampToValueAtTime(0.2,actx.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+1.5);

    p.pan.value=pan;

    o.connect(g); g.connect(p); p.connect(actx.destination);
    o.start(actx.currentTime+i*0.04);
    o.stop(actx.currentTime+2);
  });
}

/* ================= CANVAS ================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize(); addEventListener("resize",resize);

let lines=[];

function createLine(a,b){
  lines.push({
    x1:a.left+a.width/2,
    y1:a.top+a.height/2,
    x2:b.left+b.width/2,
    y2:b.top+b.height/2,
    p:0,
    state:"draw"
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  lines.forEach(l=>{
    if(l.state==="draw"){
      l.p+=0.05;
      if(l.p>=1){l.p=1;l.state="full";}
      const x=l.x1+(l.x2-l.x1)*l.p;
      const y=l.y1+(l.y2-l.y1)*l.p;

      ctx.strokeStyle="rgba(255,215,150,0.6)";
      ctx.beginPath();
      ctx.moveTo(l.x1,l.y1);
      ctx.lineTo(x,y);
      ctx.stroke();
    } else if(l.state==="full"){
      ctx.strokeStyle="rgba(255,215,150,0.4)";
      ctx.beginPath();
      ctx.moveTo(l.x1,l.y1);
      ctx.lineTo(l.x2,l.y2);
      ctx.stroke();
    } else if(l.state==="glitch"){
      l.alpha-=0.05;
      ctx.strokeStyle="rgba(255,255,255,"+l.alpha+")";
      ctx.beginPath();
      ctx.moveTo(l.x1+(Math.random()-0.5)*10,l.y1+(Math.random()-0.5)*10);
      ctx.lineTo(l.x2+(Math.random()-0.5)*10,l.y2+(Math.random()-0.5)*10);
      ctx.stroke();
    }
  });

  requestAnimationFrame(animate);
}
animate();

/* ================= JITTER GLOBAL ================= */
let glitch=false;
const layer=document.getElementById("letters-layer");

function jitter(){
  if(!glitch){
    layer.style.transform="none";
    return;
  }

  // ⚡ jitter violent type UI glitch
  const x=(Math.random()-0.5)*30;
  const y=(Math.random()-0.5)*20;
  const r=(Math.random()-0.5)*8;
  const s=1+(Math.random()-0.5)*0.1;

  layer.style.transform=
    `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;

  setTimeout(()=>requestAnimationFrame(jitter), Math.random()*40);
}

/* ================= MAIN ================= */
let letters=[];
let landed=0;

function start(){
  if(glitch) return;

  initAudio();
  document.querySelector(".click-instruction").style.opacity=0;

  let delay=0,x=60,i=0;
  let prev=null;

  words.forEach(w=>{
    w.split("").forEach(c=>{
      const span=document.createElement("span");
      span.className="letter";
      span.textContent=c;
      span.style.left=x+"px";
      layer.appendChild(span);
      letters.push(span);

      const pan=(x/innerWidth)*2-1;

      setTimeout(()=>{
        span.style.opacity=1;
        const y=200+Math.random()*40;
        span.style.top=y+"px";

        setTimeout(()=>{
          const rect=span.getBoundingClientRect();
          span.classList.add("gold");

          playChord(getQuantizedNote(rect.top,getCurrentChord()),pan);

          if(prev) createLine(prev.getBoundingClientRect(),rect);
          prev=span;

          landed++;

          if(landed===letters.length){
            setTimeout(()=>{
              glitch=true;
              lines.forEach(l=>{l.state="glitch";l.alpha=1;});
              playGlitchSound();
              jitter();

              setTimeout(()=>{
                glitch=false;
                letters.forEach(l=>l.classList.remove("gold"));
              },1200);

            },800);
          }

        },1500);

      },delay);

      delay+=[180,120,260,140,320,200][i%6];
      x+=40;
      i++;
      if(i%4===0) chordStep++;
    });
    x+=60;
  });
}

document.getElementById("wrapper").onclick=start;
</script>

</body>
</html>
