<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: black;
    overflow: hidden;
    font-family: 'Amethysta', serif;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  #wrapper {
    position: absolute;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 2;
  }

  .click-instruction {
    color: #888;
    font-size: 1.4rem;
    transition: opacity 0.5s;
  }

  .letter {
    position: absolute;
    font-size: 2.4rem;
    top: -100px;
    opacity: 0;
    color: #808080;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.4s ease;
    font-weight: bold;
    pointer-events: auto;
    z-index: 3;
  }

  .gold {
    color: #FFD700;
    text-shadow: 0 0 15px rgba(255,215,0,0.9);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="wrapper">
  <div class="click-instruction">Clique pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

let audioCtx;
let started = false;
let allLetters = [];
let constellationDone = false;

// 🎧 INIT AUDIO
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// 🎼 accords mineurs (mélancoliques)
const chords = [
  [261.63, 311.13, 392.00], // Cm
  [293.66, 349.23, 440.00], // Dm
  [329.63, 392.00, 493.88], // Em
  [349.23, 415.30, 523.25], // Fm
];

function playChord(freqs, pan) {
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = "triangle";
    osc.frequency.value = f;

    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

    panner.pan.value = pan;

    osc.connect(gain);
    gain.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(audioCtx.currentTime + i * 0.02);
    osc.stop(audioCtx.currentTime + 1.6);
  });
}

function getPan(x) {
  return (x / window.innerWidth) * 2 - 1;
}

// 🌟 PARTICULES
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function spawnParticles(x, y) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 1
    });
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;

    ctx.fillStyle = "rgba(255,215,0," + p.life + ")";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  particles = particles.filter(p => p.life > 0);

  requestAnimationFrame(animateParticles);
}
animateParticles();

// 🌌 CONSTELLATION
function drawConstellation() {
  ctx.strokeStyle = "rgba(255,215,0,0.4)";
  ctx.lineWidth = 1;

  for (let i = 0; i < allLetters.length - 1; i++) {
    const a = allLetters[i].getBoundingClientRect();
    const b = allLetters[i + 1].getBoundingClientRect();

    ctx.beginPath();
    ctx.moveTo(a.left + a.width/2, a.top + a.height/2);
    ctx.lineTo(b.left + b.width/2, b.top + b.height/2);
    ctx.stroke();
  }
}

function startAnimation() {
  if (started) return;
  started = true;

  initAudio();
  document.querySelector(".click-instruction").style.opacity = "0";

  let delay = 0;
  let offsetX = 60;
  let chordIndex = 0;

  words.forEach(word => {
    word.split("").forEach(char => {

      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = offsetX + "px";

      const chord = chords[chordIndex % chords.length];
      const pan = getPan(offsetX);

      document.body.appendChild(span);
      allLetters.push(span);

      span.addEventListener("mouseenter", () => {
        if (!span.classList.contains("gold")) {
          span.classList.add("gold");
          playChord(chord, pan);
          spawnParticles(offsetX, 220);

          setTimeout(() => span.classList.remove("gold"), 400);
        }
      });

      setTimeout(() => {
        span.style.opacity = "1";
        span.style.top = (200 + Math.random() * 40) + "px";

        setTimeout(() => {
          span.classList.add("gold");
          playChord(chord, pan);
          spawnParticles(offsetX, 220);

          // 🌌 déclenche constellation une fois
          if (!constellationDone && allLetters.every(l => l.classList.contains("gold"))) {
            constellationDone = true;
            drawConstellation();
          }

        }, 1500);

      }, delay);

      delay += 250;
      offsetX += 40;
      chordIndex++;
    });

    offsetX += 60;
  });

  setTimeout(() => {
    allLetters.forEach(l => l.classList.remove("gold"));
  }, delay + 1800);
}

document.getElementById("wrapper")
  .addEventListener("click", startAnimation);
</script>

</body>
</html>
