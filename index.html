<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: black;
    overflow: hidden;
    font-family: 'Amethysta', serif;
  }

  #wrapper {
    position: absolute;
    width: 100%; height: 100%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .click-instruction {
    color: #888;
    font-size: 1.4rem;
    transition: opacity 0.5s;
  }

  .letter {
    position: absolute;
    font-size: 2.4rem;
    top: -100px;
    opacity: 0;
    color: #808080;
    transition: top 1.5s ease-out, opacity 1s ease-out, color 0.4s ease;
    font-weight: bold;
    pointer-events: auto;
  }

  .gold {
    color: #FFD700;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
  }
</style>
</head>
<body>

<div id="wrapper">
  <div class="click-instruction">Clique pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

// 🎼 gamme cohérente
const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 493.88];

let audioCtx;
let started = false;
let allLetters = [];

// 🔓 audio
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// 🎧 note
function playNote(freq, pan = 0) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const panner = audioCtx.createStereoPanner();

  osc.type = "triangle";
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);

  panner.pan.value = pan;

  osc.connect(gain);
  gain.connect(panner);
  panner.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 1);
}

function getPan(x) {
  return (x / window.innerWidth) * 2 - 1;
}

function startAnimation() {
  if (started) return;
  started = true;

  initAudio();
  document.querySelector(".click-instruction").style.opacity = "0";

  let delay = 0;
  let offsetX = 60;
  let noteIndex = 0;

  words.forEach(word => {
    word.split("").forEach(char => {

      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = offsetX + "px";

      const note = scale[noteIndex % scale.length];
      const pan = getPan(offsetX);

      span.dataset.note = note;
      span.dataset.pan = pan;

      document.body.appendChild(span);
      allLetters.push(span);

      // HOVER interaction ✨
      span.addEventListener("mouseenter", () => {
        if (!span.classList.contains("gold")) {
          span.classList.add("gold");
          playNote(note, pan);

          setTimeout(() => {
            span.classList.remove("gold");
          }, 400);
        }
      });

      // DESCENTE
      setTimeout(() => {
        span.style.opacity = "1";
        span.style.top = (200 + Math.random() * 40) + "px";

        // IMPACT (son + doré)
        setTimeout(() => {
          span.classList.add("gold");
          playNote(note, pan);

        }, 1500);

      }, delay);

      delay += 250;
      offsetX += 40;
      noteIndex++;
    });

    offsetX += 60;
  });

  // 🕒 Quand tout est fini → tout redevient gris
  setTimeout(() => {
    allLetters.forEach(l => l.classList.remove("gold"));
  }, delay + 1800);
}

const wrapper = document.getElementById("wrapper");
wrapper.addEventListener("click", startAnimation);
wrapper.addEventListener("touchstart", startAnimation);
</script>

</body>
</html>
