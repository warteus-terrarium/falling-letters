<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css?family=Amethysta' rel='stylesheet'>
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: black;
  overflow: hidden;
  font-family: 'Amethysta', serif;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

#wrapper {
  position: absolute;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
}

.click-instruction {
  color: #888;
  font-size: 1.4rem;
  transition: opacity 0.5s;
}

.letter {
  position: absolute;
  font-size: 2.4rem;
  top: -100px;
  opacity: 0;
  color: #808080;
  transition: top 1.5s ease-out, opacity 1s ease-out, color 0.4s ease;
  font-weight: bold;
  pointer-events: auto;
  z-index: 3;
}

.gold {
  color: #FFD700;
  text-shadow: 0 0 15px rgba(255,215,0,0.9);
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="wrapper">
  <div class="click-instruction">Clique pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

let audioCtx;
let started = false;
let allLetters = [];
let landedCount = 0;

// AUDIO
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

// GAMME & PROGRESSION
const scale = [0,2,3,5,7,8,10];
const progression = [[0,2,4],[5,0,2],[3,5,0],[4,6,1]];
let chordStep = 0;

function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}
function getQuantizedNote(y,chord){
  const minY=180,maxY=260;
  let t=(y-minY)/(maxY-minY); t=Math.max(0,Math.min(1,t));
  const octave=Math.floor(3+(1-t)*2);
  const degree=chord[Math.floor(Math.random()*chord.length)];
  const midi=57+scale[degree]+(octave-4)*12;
  return midiToFreq(midi);
}
function getCurrentChord(){return progression[chordStep%progression.length];}

// ACCORD
function playChord(freq,pan){
  const ratios=[1,1.2,1.5];
  ratios.forEach((r,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const panner=audioCtx.createStereoPanner();
    osc.type="triangle"; osc.frequency.value=freq*r;
    gain.gain.setValueAtTime(0,audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18,audioCtx.currentTime+0.05);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.8);
    panner.pan.value=pan;
    osc.connect(gain); gain.connect(panner); panner.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime+i*0.04); osc.stop(audioCtx.currentTime+2);
  });
}
function getPan(x){return (x/window.innerWidth)*2-1;}

// CANVAS
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let particles=[], constellationLines=[];

function resize(){canvas.width=window.innerWidth; canvas.height=window.innerHeight;}
resize(); window.addEventListener("resize",resize);

function spawnParticles(x,y){
  for(let i=0;i<15;i++){particles.push({x,y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:1});}
}

// BUILD CONSTELLATION
function buildConstellation(){
  constellationLines=[];
  for(let i=0;i<allLetters.length-1;i++){
    const a=allLetters[i].getBoundingClientRect();
    const b=allLetters[i+1].getBoundingClientRect();
    constellationLines.push({x1:a.left+a.width/2,y1:a.top+a.height/2,x2:b.left+b.width/2,y2:b.top+b.height/2,progress:0,life:1});
  }
}

// ANIMATE
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // PARTICULES
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life-=0.02;
    ctx.fillStyle="rgba(255,215,0,"+p.life+")";
    ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
  });
  particles=particles.filter(p=>p.life>0);

  // CONSTELLATION
  constellationLines.forEach(line=>{
    if(line.progress<1){
      line.progress+=0.02;
      const x=line.x1+(line.x2-line.x1)*line.progress;
      const y=line.y1+(line.y2-line.y1)*line.progress;
      ctx.strokeStyle="rgba(255,215,0,0.5)";
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(line.x1,line.y1);
      ctx.lineTo(x,y);
      ctx.stroke();
    }else{
      // fade glitch effect if marked
      if(line.glitch){
        const alpha=Math.random()*0.8+0.2;
        ctx.strokeStyle="rgba(0,200,255,"+alpha+")";
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(line.x1,line.y1);
        ctx.lineTo(line.x2,line.y2);
        ctx.stroke();
        line.life-=0.05;
      }else{
        line.life-=0.002;
        ctx.strokeStyle="rgba(255,215,0,"+line.life+")";
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(line.x1,line.y1);
        ctx.lineTo(line.x2,line.y2);
        ctx.stroke();
      }
    }
  });
  constellationLines=constellationLines.filter(l=>l.life>0);

  requestAnimationFrame(animate);
}

// RYTHME
const rhythm=[180,120,260,140,320,200];

function playGlitchScream(){
  // bruit fort
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="square";
  osc.frequency.value=300;
  gain.gain.setValueAtTime(1,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+0.3);
}

function startAnimation(){
  if(started) return;
  started=true;
  initAudio();
  document.querySelector(".click-instruction").style.opacity="0";

  let delay=0, offsetX=60, noteIndex=0;
  let prevLetter=null;

  words.forEach(word=>{
    word.split("").forEach(char=>{
      const span=document.createElement("span");
      span.className="letter"; span.textContent=char;
      span.style.left=offsetX+"px"; document.body.appendChild(span);
      allLetters.push(span);
      const pan=getPan(offsetX);

      span.addEventListener("mouseenter",()=>{
        if(!span.classList.contains("gold")){
          const rect=span.getBoundingClientRect();
          const freq=getQuantizedNote(rect.top,getCurrentChord());
          span.classList.add("gold");
          playChord(freq,pan);
          spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2);
          setTimeout(()=>span.classList.remove("gold"),400);
        }
      });

      setTimeout(()=>{
        span.style.opacity="1";
        const finalY=200+Math.random()*40;
        span.style.top=finalY+"px";

        setTimeout(()=>{
          const rect=span.getBoundingClientRect();
          const freq=getQuantizedNote(rect.top,getCurrentChord());
          span.classList.add("gold");
          playChord(freq,pan);
          spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2);
          landedCount++;

          if(prevLetter){
            constellationLines.push({x1:prevLetter.getBoundingClientRect().left+prevLetter.offsetWidth/2,
                                     y1:prevLetter.getBoundingClientRect().top+prevLetter.offsetHeight/2,
                                     x2:rect.left+rect.width/2,
                                     y2:rect.top+rect.height/2,
                                     progress:0,
                                     life:1});
          }
          prevLetter=span;

          // Effet glitch + screamer après tout
          if(landedCount===allLetters.length){
            setTimeout(()=>{
              // glitch sur lettres
              allLetters.forEach(l=>{
                const original=l.style.color;
                let i=0;
                const glitchInt=setInterval(()=>{
                  const colors=["#00ffff","#ff00ff","#00ffff","#ff00ff"];
                  l.style.color=colors[i%colors.length];
                  i++;
                  if(i>6){ clearInterval(glitchInt); l.style.color="#808080"; }
                },50);
              });
              // glitch + fade lignes
              constellationLines.forEach(line=>line.glitch=true);
              // bruit fort
              playGlitchScream();
            },1000);
          }

        },1500);

      },delay);

      delay+=rhythm[noteIndex%rhythm.length];
      offsetX+=40;
      noteIndex++;
      if(noteIndex%4===0) chordStep++;
    });
    offsetX+=60;
  });
}

document.getElementById("wrapper").addEventListener("click",startAnimation);

</script>

</body>
</html>
