<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lettre Harpe avec Sons Intégrés</title>
<style>
  body { margin: 0; overflow: hidden; background: black; color: white; cursor:pointer; }
  .letter { position:absolute; font-size:2rem; top:-50px; opacity:0; transition: top 1.5s ease-out, color 0.5s; color:#808080; }
  @keyframes oscillate { 0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
  .oscillate { animation:oscillate 0.5s ease-out; }
  .click-instruction { position:absolute; top:50%; width:100%; text-align:center; font-size:1.5rem; }
</style>
</head>
<body>

<div class="click-instruction">Cliquez pour commencer</div>

<script>
// Sons encodés (exemple simplifié, très courts)
const base64Sounds = [
  "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQgAAA==",
  "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQgAAA=="
];

let context;
let buffers = [];

async function loadSounds() {
  buffers = [];
  for (const data of base64Sounds) {
    const response = await fetch(data);
    const arrayBuffer = await response.arrayBuffer();
    const audioBuffer = await context.decodeAudioData(arrayBuffer);
    buffers.push(audioBuffer);
  }
}

function playHarpNote() {
  if (!buffers.length) return;
  const buffer = buffers[Math.floor(Math.random() * buffers.length)];
  const src = context.createBufferSource();
  src.buffer = buffer;
  src.connect(context.destination);
  src.start();
}

function startLetters() {
  document.querySelector(".click-instruction").remove();

  const words = ["Orpheus","CARENTHIR"];
  let offsetX = 50;
  let delay = 0;

  words.forEach(word => {
    word.split("").forEach(letter => {
      const span = document.createElement("span");
      span.textContent = letter;
      span.classList.add("letter");
      document.body.appendChild(span);
      span.style.left = offsetX + "px";
      offsetX += 30;

      setTimeout(() => {
        span.style.top = (200 + Math.random()*20) + "px";
        span.style.opacity = 1;
        span.addEventListener("transitionend", e => {
          if (e.propertyName === "top") {
            span.style.color = "#FFD700";
            playHarpNote();
            span.classList.add("oscillate");
          }
        });
      }, delay);

      delay += 300;
    });
    offsetX += 30;
  });
}

document.body.addEventListener("click", async function handler() {
  context = new (window.AudioContext||window.webkitAudioContext)();
  await loadSounds(); // load base64 embeds
  startLetters();
  document.body.removeEventListener("click", handler);
});
</script>

</body>
</html>
