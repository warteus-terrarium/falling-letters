<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css?family=Amethysta" rel="stylesheet">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: "Amethysta", serif;
}

canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#main-canvas {
  z-index: 1;
}

#glitch-canvas {
  z-index: 4;
  mix-blend-mode: screen;
}

#wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
}

.click-instruction {
  color: #888;
  font-size: 1.4rem;
  text-align: center;
  transition: opacity 0.5s ease;
}

#letters-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.letter {
  position: absolute;
  top: -100px;
  opacity: 0;
  color: #808080;
  font-size: 2.4rem;
  font-weight: bold;
  pointer-events: auto;
  transition:
    top 1.5s ease-out,
    opacity 1s ease-out,
    color 0.35s ease,
    text-shadow 0.35s ease,
    filter 0.2s ease;
  will-change: top, opacity, color, text-shadow, filter;
}

.gold {
  color: #FFD700;
  text-shadow:
    0 0 10px rgba(255, 215, 0, 0.9),
    0 0 20px rgba(255, 215, 0, 0.5);
}
</style>
</head>
<body>

<canvas id="main-canvas"></canvas>
<canvas id="glitch-canvas"></canvas>
<div id="letters-layer"></div>

<div id="wrapper">
  <div class="click-instruction">Clique pour éveiller Orpheus</div>
</div>

<script>
const words = ["Orpheus", "CARENTHIR"];

/* ================= AUDIO ================= */
let actx = null;
let bufs = [];

function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (bufs.length) return;

  for (let i = 0; i < 4; i++) {
    const sr = 44100;
    const dur = 1.15 + Math.random() * 0.2;
    const buf = actx.createBuffer(1, sr * dur, sr);
    const data = buf.getChannelData(0);

    for (let j = 0; j < buf.length; j++) {
      const t = j / sr;
      let s = (Math.random() * 2 - 1) * 0.55;
      s += Math.sin(2 * Math.PI * (900 + Math.random() * 500) * t) * 0.03;
      data[j] = s;
    }

    bufs.push(buf);
  }
}

function playGlitchSound() {
  if (!actx) initAudio();
  if (!actx || !bufs.length) return;

  const src = actx.createBufferSource();
  const hp = actx.createBiquadFilter();
  const bp = actx.createBiquadFilter();
  const gain = actx.createGain();

  src.buffer = bufs[Math.floor(Math.random() * bufs.length)];
  src.playbackRate.value = 0.82 + Math.random() * 0.12;

  hp.type = "highpass";
  hp.frequency.value = 700;

  bp.type = "bandpass";
  bp.frequency.value = 1800 + Math.random() * 900;
  bp.Q.value = 0.7;

  gain.gain.setValueAtTime(0.0001, actx.currentTime);
  gain.gain.linearRampToValueAtTime(1.0, actx.currentTime + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 1.15);

  src.connect(hp);
  hp.connect(bp);
  bp.connect(gain);
  gain.connect(actx.destination);

  src.start();
}

/* ================= MUSIQUE ================= */
const scale = [0, 2, 3, 5, 7, 8, 10];
const progression = [
  [0, 2, 4],
  [5, 0, 2],
  [3, 5, 0],
  [4, 6, 1]
];
let chordStep = 0;

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function getCurrentChord() {
  return progression[chordStep % progression.length];
}

function getQuantizedNote(y, chord) {
  const minY = 180;
  const maxY = 260;
  let t = (y - minY) / (maxY - minY);
  t = Math.max(0, Math.min(1, t));

  const octave = Math.floor(3 + (1 - t) * 2);
  const degree = chord[Math.floor(Math.random() * chord.length)];
  const midi = 57 + scale[degree] + (octave - 4) * 12;
  return midiToFreq(midi);
}

function playChord(freq, pan) {
  if (!actx) initAudio();
  if (!actx) return;

  [1, 1.2, 1.5].forEach((r, i) => {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    const panner = actx.createStereoPanner();
    const filter = actx.createBiquadFilter();

    osc.type = "triangle";
    osc.frequency.value = freq * r;

    filter.type = "lowpass";
    filter.frequency.value = 1800;

    gain.gain.setValueAtTime(0.0001, actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18, actx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 1.8);

    panner.pan.value = pan;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(panner);
    panner.connect(actx.destination);

    osc.start(actx.currentTime + i * 0.04);
    osc.stop(actx.currentTime + 2);
  });
}

/* ================= CANVAS ================= */
const mainCanvas = document.getElementById("main-canvas");
const mainCtx = mainCanvas.getContext("2d");
const glitchCanvas = document.getElementById("glitch-canvas");
const glitchCtx = glitchCanvas.getContext("2d");
const lettersLayer = document.getElementById("letters-layer");

function resizeCanvas() {
  mainCanvas.width = window.innerWidth;
  mainCanvas.height = window.innerHeight;
  glitchCanvas.width = window.innerWidth;
  glitchCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];
let lines = [];
let letterModels = [];

/* ================= PARTICULES ================= */
function spawnParticles(x, y, color = "gold") {
  const count = color === "glitch" ? 30 : 18;
  for (let i = 0; i < count; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * (color === "glitch" ? 5.2 : 2.5),
      vy: (Math.random() - 0.5) * (color === "glitch" ? 5.2 : 2.5),
      life: 1,
      color
    });
  }
}

/* ================= CONSTELLATION ================= */
function createLine(fromRect, toRect) {
  lines.push({
    x1: fromRect.left + fromRect.width / 2,
    y1: fromRect.top + fromRect.height / 2,
    x2: toRect.left + toRect.width / 2,
    y2: toRect.top + toRect.height / 2,
    p: 0,
    alpha: 1,
    state: "draw"
  });
}

/* ================= GLITCH STYLE ================= */
let started = false;
let landed = 0;
let letters = [];
let glitchActive = false;

function updateLetterModels() {
  letterModels = letters.map(letter => {
    const rect = letter.getBoundingClientRect();
    return {
      char: letter.textContent,
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height * 0.78,
      gold: letter.classList.contains("gold"),
      size: parseFloat(getComputedStyle(letter).fontSize)
    };
  });
}

function drawGlitchGhostText(ctx, models, dx, dy, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";

  for (const m of models) {
    ctx.font = `bold ${m.size}px Amethysta`;
    ctx.fillText(m.char, m.x + dx, m.y + dy);
  }
  ctx.restore();
}

function drawGlitchGhostLines(ctx, dx, dy, color, alpha, lineWidth = 1.5) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;

  for (const l of lines) {
    if (l.state === "dead") continue;

    let x2 = l.x2;
    let y2 = l.y2;

    if (l.state === "draw") {
      x2 = l.x1 + (l.x2 - l.x1) * l.p;
      y2 = l.y1 + (l.y2 - l.y1) * l.p;
    }

    ctx.beginPath();
    ctx.moveTo(l.x1 + dx, l.y1 + dy);
    ctx.lineTo(x2 + dx, y2 + dy);
    ctx.stroke();
  }

  ctx.restore();
}

function drawBandSlicedPass(ctx, models) {
  const bandCount = 7 + Math.floor(Math.random() * 6);

  for (let i = 0; i < bandCount; i++) {
    const y = Math.random() * ctx.canvas.height;
    const h = 18 + Math.random() * 75;
    const shift = (Math.random() - 0.5) * 90;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y, ctx.canvas.width, h);
    ctx.clip();

    drawGlitchGhostText(ctx, models, shift, 0, "rgba(255,255,255,0.55)", 0.7);
    drawGlitchGhostLines(ctx, shift, 0, "rgba(255,255,255,0.45)", 0.8, 1.4);
    ctx.restore();
  }
}

function renderGlitchOverlay() {
  glitchCtx.clearRect(0, 0, glitchCanvas.width, glitchCanvas.height);
  if (!glitchActive) return;

  updateLetterModels();

  const cx = (Math.random() - 0.5) * 12;
  const cy = (Math.random() - 0.5) * 4;

  const blueDx = -18 - Math.random() * 16;
  const yellowDx = 18 + Math.random() * 16;
  const blueDy = (Math.random() - 0.5) * 6;
  const yellowDy = (Math.random() - 0.5) * 6;

  const midDx = (Math.random() - 0.5) * 8;
  const midDy = (Math.random() - 0.5) * 3;

  drawGlitchGhostText(glitchCtx, letterModels, cx + blueDx, cy + blueDy, "#2948ff", 0.72);
  drawGlitchGhostText(glitchCtx, letterModels, cx + yellowDx, cy + yellowDy, "#fff200", 0.68);
  drawGlitchGhostText(glitchCtx, letterModels, cx + midDx, cy + midDy, "rgba(0,0,0,0.82)", 0.55);

  drawGlitchGhostLines(glitchCtx, blueDx, blueDy, "#2948ff", 0.55, 2);
  drawGlitchGhostLines(glitchCtx, yellowDx, yellowDy, "#fff200", 0.52, 2);
  drawGlitchGhostLines(glitchCtx, midDx, midDy, "rgba(0,0,0,0.55)", 0.5, 1.7);

  drawBandSlicedPass(glitchCtx, letterModels);

  if (Math.random() > 0.55) {
    const bandY = Math.random() * glitchCanvas.height;
    const bandH = 8 + Math.random() * 24;
    glitchCtx.fillStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.08})`;
    glitchCtx.fillRect(0, bandY, glitchCanvas.width, bandH);
  }
}

function startFinalGlitch() {
  glitchActive = true;

  letters.forEach(letter => {
    const rect = letter.getBoundingClientRect();
    spawnParticles(
      rect.left + rect.width / 2,
      rect.top + rect.height / 2,
      "glitch"
    );
  });

  lines.forEach(l => {
    l.state = "glitch";
    l.alpha = 1;
  });

  playGlitchSound();

  setTimeout(() => {
    glitchActive = false;
    glitchCtx.clearRect(0, 0, glitchCanvas.width, glitchCanvas.height);
    letters.forEach(l => l.classList.remove("gold"));
  }, 1200);
}

/* ================= MAIN LOOP ================= */
function animate() {
  mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= (p.color === "glitch" ? 0.035 : 0.02);

    if (p.color === "glitch") {
      const palette = [
        "rgba(41,72,255,ALPHA)",
        "rgba(255,242,0,ALPHA)",
        "rgba(255,255,255,ALPHA)"
      ];
      const color = palette[Math.floor(Math.random() * palette.length)]
        .replace("ALPHA", Math.max(0, p.life).toFixed(3));
      mainCtx.fillStyle = color;
    } else {
      mainCtx.fillStyle = `rgba(255,215,0,${Math.max(0, p.life)})`;
    }

    mainCtx.beginPath();
    mainCtx.arc(p.x, p.y, p.color === "glitch" ? 2.6 : 2, 0, Math.PI * 2);
    mainCtx.fill();
  });

  particles = particles.filter(p => p.life > 0);

  lines.forEach(l => {
    if (l.state === "draw") {
      l.p += 0.05;
      if (l.p >= 1) {
        l.p = 1;
        l.state = "full";
      }

      const x = l.x1 + (l.x2 - l.x1) * l.p;
      const y = l.y1 + (l.y2 - l.y1) * l.p;

      mainCtx.strokeStyle = "rgba(255,215,150,0.62)";
      mainCtx.lineWidth = 1.2;
      mainCtx.beginPath();
      mainCtx.moveTo(l.x1, l.y1);
      mainCtx.lineTo(x, y);
      mainCtx.stroke();
    }

    else if (l.state === "full") {
      mainCtx.strokeStyle = "rgba(255,215,150,0.38)";
      mainCtx.lineWidth = 1.1;
      mainCtx.beginPath();
      mainCtx.moveTo(l.x1, l.y1);
      mainCtx.lineTo(l.x2, l.y2);
      mainCtx.stroke();
    }

    else if (l.state === "glitch") {
      l.alpha -= 0.04;
      if (l.alpha <= 0) {
        l.state = "dead";
        return;
      }

      const dx1 = (Math.random() - 0.5) * 18;
      const dx2 = (Math.random() - 0.5) * 18;
      const dy1 = (Math.random() - 0.5) * 5;
      const dy2 = (Math.random() - 0.5) * 5;

      mainCtx.strokeStyle = `rgba(255,255,255,${l.alpha})`;
      mainCtx.lineWidth = 1.6;
      mainCtx.beginPath();
      mainCtx.moveTo(l.x1 + dx1, l.y1 + dy1);
      mainCtx.lineTo(l.x2 + dx2, l.y2 + dy2);
      mainCtx.stroke();
    }
  });

  lines = lines.filter(l => l.state !== "dead");

  renderGlitchOverlay();

  requestAnimationFrame(animate);
}
animate();

/* ================= LOGIQUE PRINCIPALE ================= */
const rhythm = [180, 120, 260, 140, 320, 200];
const wrapper = document.getElementById("wrapper");

function start() {
  if (started) return;
  started = true;

  initAudio();
  document.querySelector(".click-instruction").style.opacity = 0;

  let delay = 0;
  let x = 60;
  let i = 0;
  let prev = null;

  words.forEach(word => {
    word.split("").forEach(char => {
      const span = document.createElement("span");
      span.className = "letter";
      span.textContent = char;
      span.style.left = x + "px";
      lettersLayer.appendChild(span);
      letters.push(span);

      const pan = (x / innerWidth) * 2 - 1;

      span.addEventListener("mouseenter", () => {
        if (glitchActive) return;
        if (!span.classList.contains("gold")) {
          const rect = span.getBoundingClientRect();
          const freq = getQuantizedNote(rect.top, getCurrentChord());

          span.classList.add("gold");
          playChord(freq, pan);
          spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

          setTimeout(() => {
            if (!glitchActive) span.classList.remove("gold");
          }, 400);
        }
      });

      setTimeout(() => {
        span.style.opacity = 1;
        const y = 200 + Math.random() * 40;
        span.style.top = y + "px";

        setTimeout(() => {
          const rect = span.getBoundingClientRect();
          const freq = getQuantizedNote(rect.top, getCurrentChord());

          span.classList.add("gold");
          playChord(freq, pan);
          spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

          if (prev) {
            createLine(prev.getBoundingClientRect(), rect);
          }
          prev = span;

          landed++;

          if (landed === letters.length) {
            setTimeout(() => {
              startFinalGlitch();
            }, 800);
          }

        }, 1500);

      }, delay);

      delay += rhythm[i % rhythm.length];
      x += 40;
      i++;

      if (i % 4 === 0) {
        chordStep++;
      }
    });

    x += 60;
  });
}

wrapper.addEventListener("click", start);
wrapper.addEventListener("touchstart", start, { passive: true });
</script>

</body>
</html>
